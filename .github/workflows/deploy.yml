# Deploys Present to Firebase (Hosting + Firestore rules and indexes).
#
# Runs only on demand from the Actions tab ("Run workflow"). Pushes do not
# trigger it. To deploy on every push to main later, add under `on:`:
#   push:
#     branches: [main]
#
# Keyless: no Google key is stored anywhere. Each run asks GitHub for a
# short-lived signed token, and Google's Workload Identity Federation trusts
# it only when it comes from this repository (by numeric id) on `main`, then
# hands back a credential for the `github-deploy` service account that
# expires within the hour. Setup: docs/deploy-setup.md.
#
# Free on GitHub-hosted runners; Firebase stays on the free Spark plan.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables).
# None of these are secrets; they only name things:
#   FIREBASE_PROJECT_ID              the Firebase project id
#   GCP_WORKLOAD_IDENTITY_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/github/providers/present-repo
#   GCP_SERVICE_ACCOUNT              github-deploy@<project-id>.iam.gserviceaccount.com
name: Deploy to Firebase

on:
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the run request its GitHub identity token

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CONFIGURED: ${{ vars.FIREBASE_PROJECT_ID != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check setup
        if: env.CONFIGURED != 'true'
        run: |
          echo "::warning::Deploy skipped: set the FIREBASE_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT repository variables (see docs/deploy-setup.md)."

      - name: Only from main
        if: env.CONFIGURED == 'true' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only; Google refuses other branches too."
          exit 1

      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'

      - uses: actions/setup-node@v4
        if: env.CONFIGURED == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        if: env.CONFIGURED == 'true'
        run: npm ci

      - name: Authenticate to Google Cloud (keyless)
        if: env.CONFIGURED == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy
        if: env.CONFIGURED == 'true'
        # firebase.json's predeploy step builds the web app.
        run: npx firebase deploy --only hosting,firestore --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
